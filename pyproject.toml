[project]
name = "matn-research"
version = "0.1.0"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "annotated-doc>=0.0.4",
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "openai-agents>=0.17.4",
  "pydantic>=2.13.4",
  "telegramify-markdown>=1.1.5",
  "uvicorn>=0.48",
]

[dependency-groups]
dev = [
  "ruff>=0.15.14",
]
